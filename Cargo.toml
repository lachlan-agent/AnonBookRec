[package]
name = "anonbookrec"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
bs58 = "0.5.1"
chacha20poly1305 = "0.10"
crypto_box = { version = "0.9", features = ["seal", "chacha20"] }
hex = "0.4.3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
hkdf = "0.12"
hmac = "0.12"
rand = "0.8"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "charset", "http2", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header", "trace", "limit"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
argon2 = "0.5.3"

[dev-dependencies]
http-body-util = "0.1.4"
tower = { version = "0.5.3", features = ["util"] }
