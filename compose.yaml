services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Set your real domain here (or in a .env file next to this compose file).
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN in .env}
      SECURE_COOKIES: "1"
      RUST_LOG: info
    volumes:
      - app-data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
